syntax = "proto3";

import "google/protobuf/descriptor.proto";
import "schema/schema.proto";

package hivemapper.types.v2;

message Transactions {
  repeated Transaction transactions = 3;
}

message Transaction {
  option (schema.table) = {
    name: "transactions"
  };

  string trx_hash = 1 [(schema.field) = { primary_key: true }];
  repeated Instruction instructions = 2;
}

message Instruction {
  option (schema.table) = {
    name: "instructions"
    child_of: "transactions on trx_hash"
  };

  string instruction_id =1 [(schema.field) = { primary_key: true }];

  oneof Item {
    Mint mint = 10;
    Burn burn = 11;
    Transfer transfer = 12;
    InitializedAccount initialized_account = 13;
  }
}

message Transfer {
  option (schema.table) = {
    name: "transfers"
    child_of: "instructions on instruction_id"
  };

  string from = 2;
  string to = 3;
  double amount = 4;
}

message Mint {
  option (schema.table) = {
    name: "mints"
    child_of: "instructions on instruction_id"
  };

  enum Type {
    UNSET = 0;
    MINT = 1;
    REGULAR_DRIVER = 2;
    NO_SPLIT = 3;
    AI_TRAINER = 4;
    OPERATIONAL = 5;
    REWARD = 6;
    FLEET_MANAGER = 7;
    FLEET_DRIVER = 8;
    MAP_CONSUMPTION = 9;
  }

  string to = 2;
  double amount = 3;
  
  Type type = 4;
}

message Burn {
  option (schema.table) = {
    name: "burns"
    child_of: "instructions on instruction_id"
  };

  enum Type {
    UNSET = 0;
    BURN = 1;
    MAP_CREATE = 2;
  }

  string from = 2;
  double amount = 3;
  Type type = 4;
}

  message InitializedAccount {
    option (schema.table) = {
      name: "initialized_accounts"
      child_of: "instructions on instruction_id"
    };


  string account = 1;
  string mint = 2;
  string owner = 3;
}